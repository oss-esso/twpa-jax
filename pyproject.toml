[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twpa-solver"
version = "0.1.0"
description = "TWPA/KITWPA harmonic-balance simulation tools"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "pytest",
  "pyyaml",
]

[project.optional-dependencies]
# PARDISO is the default sparse factorization backend and is a large speedup
# on the multitone problems, but SuperLU works via the automatic fallback.
fast = ["pypardiso"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["twpa_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: dense harmonic-balance smoke tests, enabled with --run-slow",
]
