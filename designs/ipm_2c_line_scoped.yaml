schema_version: 1
name: ipm_2c_line_scoped
coupler_mode: cached

parameters:
  config: ipm_default
  array_length: 418

topology:
  - line: 1
    port in: 1
    port out: 2
    blocks:
      - type: input_ports
        name: input_signal

      - type: directional_coupler
        name: coupler_in
        port in signal: 1
        port in pump: 3
        port out signal: 2
        port out pump: 4

      - type: ipm_line
        name: line_1
        rows: 3

      - type: directional_coupler
        name: coupler_1
        port in signal: 1
        port in pump: 3
        port out signal: 2
        port out pump: 4

      - type: ipm_tail
        name: line_2
        rows: 3
        final_array: true

      - type: cpw
        name: output_signal_tl
        cells: ${len2}

      - type: output_ports
        name: output_signal

  - line: 2
    port in: 3
    port out: 4
    blocks:
      - type: input_ports
        name: input_pump

      - type: directional_coupler
        name: coupler_in

      - type: ipm_line
        name: line_1

      - type: directional_coupler
        name: coupler_1

      - type: ipm_tail
        name: line_2

      - type: output_ports
        name: output_pump
