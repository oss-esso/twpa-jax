schema_version: 1
name: ipm_3c
ground: 0
cursors:
  signal: 1
  pump: 10000

parameters:
  Lj: 1.239e-10
  Cj: 1.45e-13
  Cg: 6.6e-14
  Ll: 4.24e-12
  Cl: 1.695e-15
  array_length: 418
  short_tl: 90
  long_tl: 900
  coupler_section: 800

topology:
  - line: signal
    port in: 1
    port out: 2
    blocks:
      - type: input_ports
        name: in_signal
      - type: directional_coupler
        name: coupler_in
        cursors: [signal, pump]
      - type: jj_line
        name: period_0_array_0
        cells: ${array_length}
        Lj: ${Lj}
        Cj: ${Cj}
        Cg: ${Cg}
      - type: transmission_line
        name: period_0_link
        cells: ${short_tl}
        L: ${Ll}
        C: ${Cl}
      - type: jj_line
        name: period_0_array_1
        cells: ${array_length}
        Lj: ${Lj}
        Cj: ${Cj}
        Cg: ${Cg}
      - type: transmission_line
        name: period_0_long
        cells: ${long_tl}
        L: ${Ll}
        C: ${Cl}
      - type: directional_coupler
        name: period_0_coupler
        cursors: [signal, pump]
      - type: jj_line
        name: period_1_array_0
        cells: ${array_length}
        Lj: ${Lj}
        Cj: ${Cj}
        Cg: ${Cg}
      - type: transmission_line
        name: period_1_link
        cells: ${short_tl}
        L: ${Ll}
        C: ${Cl}
      - type: jj_line
        name: period_1_array_1
        cells: ${array_length}
        Lj: ${Lj}
        Cj: ${Cj}
        Cg: ${Cg}
      - type: transmission_line
        name: period_1_long
        cells: ${long_tl}
        L: ${Ll}
        C: ${Cl}
      - type: directional_coupler
        name: period_1_coupler
        cursors: [signal, pump]
      - type: jj_line
        name: tail_array
        cells: ${array_length}
        Lj: ${Lj}
        Cj: ${Cj}
        Cg: ${Cg}
      - type: transmission_line
        name: tail_link
        cells: ${short_tl}
        L: ${Ll}
        C: ${Cl}
      - type: jj_line
        name: final_array
        cells: ${array_length}
        Lj: ${Lj}
        Cj: ${Cj}
        Cg: ${Cg}
      - type: transmission_line
        name: out_signal_tl
        cells: 50
        L: ${Ll}
        C: ${Cl}
      - type: output_ports
        name: out_signal

  - line: pump
    port in: 3
    port out: 4
    blocks:
      - type: input_ports
        name: in_pump
      - type: directional_coupler
        name: coupler_in
      - type: transmission_line
        name: period_0_section
        cells: ${coupler_section}
        L: ${Ll}
        C: ${Cl}
      - type: directional_coupler
        name: period_0_coupler
      - type: transmission_line
        name: period_1_section
        cells: ${coupler_section}
        L: ${Ll}
        C: ${Cl}
      - type: directional_coupler
        name: period_1_coupler
      - type: output_ports
        name: out_pump
