schema_version: 1
name: ipm_20c
cursors:
  signal: 1
  pump: 100000
parameters:
  config: ipm_default

topology:
  - line: 1
    port in: 1
    port out: 2
    blocks:
      - type: input_ports
        name: input_signal

      - type: directional_coupler
        name: coupler_in
        port in signal: 1
        port in pump: 3
        port out signal: 2
        port out pump: 4

      - repeat:
          name: period
          count: 19
          topology:
            - type: ipm_line
              name: line_period
            - type: directional_coupler
              name: coupler_period
              port in signal: 1
              port in pump: 3
              port out signal: 2
              port out pump: 4

      - type: ipm_tail
        name: line_final

      - type: output_ports
        name: output_signal

  - line: 2
    port in: 3
    port out: 4
    blocks:
      - type: input_ports
        name: input_pump

      - type: directional_coupler
        name: coupler_in

      - repeat:
          name: period
          count: 19
          topology:
            - type: ipm_line
              name: line_period
            - type: directional_coupler
              name: coupler_period

      - type: ipm_tail
        name: line_final

      - type: output_ports
        name: output_pump
